<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SlugMarket</title>
    <meta name="description" content="SlugMarket is a UCSC-only student marketplace.">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6faf4;
        color: #173f32;
      }
      main {
        width: min(92vw, 560px);
        padding: 32px;
        border: 1px solid rgba(23, 63, 50, 0.12);
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgba(23, 63, 50, 0.10);
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 52px);
      }
      p {
        color: rgba(23, 63, 50, 0.72);
        line-height: 1.6;
      }
      a {
        color: #1d7f70;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SlugMarket</h1>
      <p>A UCSC-only marketplace for student listings, housing, and campus deals.</p>
      <p><a href="https://mukund604.github.io/slugmarket-site/">Open SlugMarket website</a></p>
    </main>
  </body>
</html>
